name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP (with sodium for the engine signature tests)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sodium

      - name: PHP syntax check
        run: |
          # Lint every PHP file shipped to fleet sites. A syntax error
          # in any one would break the auto-update on all 21 sites at
          # once, so this is a hard gate before the release zip is
          # built.
          set -e
          find zs-fleet.php modules deploy -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Engine tests (hard gate — the update engine cannot ship broken)
        run: |
          # Pure logic + Ed25519 signature verification, and the stateful
          # stash/restore core against real dirs (byte-identical restore).
          set -e
          php tests/test-engine-pure.php
          php tests/test-stash-restore.php
          php tests/test-proxy-https.php

      - name: Build release zip
        run: |
          # Stable asset name (no version suffix): the auto-updater
          # and self-bootstrap loader fetch it from
          #   github.com/<repo>/releases/latest/download/zs-fleet.zip
          # which redirects to the latest stable release without
          # touching the GitHub API (no rate limits).
          mkdir -p dist/zs-fleet
          cp zs-fleet.php dist/zs-fleet/
          cp -r modules dist/zs-fleet/
          cp deploy/zs-fleet-loader.php dist/
          cp README.md dist/zs-fleet/
          cd dist
          zip -r "zs-fleet.zip" zs-fleet zs-fleet-loader.php

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/zs-fleet.zip
          generate_release_notes: true
          # Tags with a hyphen suffix (v0.2.0-canary, v0.2.0-rc1) are
          # published as prereleases. The auto-updater queries
          # /releases/latest, which excludes prereleases — so prerelease
          # tags are visible on GitHub but invisible to fleet sites.
          # That is the canary mechanism.
          prerelease: ${{ contains(github.ref_name, '-') }}
